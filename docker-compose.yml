# M_A — Data Warehouse & BI Engineering, Week 13+ local stack
# Start:   docker compose up -d
# Status:  docker compose ps
# Stop:    docker compose down        (data kept in volume)
# Reset:   docker compose down -v     (deletes data!)
#
# NOTE: host already runs a native SQL Server on 1433, so the container uses 14333.

name: m_a

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ma_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "${MSSQL_PORT:-14333}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./sql:/sql:ro
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # One-shot: creates RetailUZ demo DB once SQL Server is healthy (idempotent)
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ma_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/bash", "-c", "for f in /sql/init/*.sql; do echo \"running $$f\"; /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i \"$$f\" || exit 1; done; echo INIT_DONE"]
    restart: "no"

  clickhouse:
    build: ./docker/clickhouse            # clickhouse-server:25.8 + ODBC Driver 18 + odbc-bridge
    image: m_a/clickhouse-odbc:25.8
    container_name: ma_clickhouse
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}   # used by odbc() load script (sql/clickhouse/03_*.sql)
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP + Play UI
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"    # native protocol
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./data:/data
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mssql_data:
  clickhouse_data:  
